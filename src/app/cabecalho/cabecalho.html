<header class="header">
    <div class="header-content">
      <a routerLink="/">
      <div class="logo-area">
        <div class="logo-icon"><img src="/logo2.png" alt="Logo"></div>
        <div class="logo-texts">
          <span class="logo-title">DR. PARDINI</span>
          <span class="logo-subtitle">LABORATÓRIO CLÍNICO</span>
        </div>
      </div>
      </a>

      <nav class="nav-menu">
        <a href="#" class="active">HOME</a>
        <a href="/guia-exames">EXAMES</a>
        <a href="/contato">CONTATO</a>
        <a href="#convenios">CONVÊNIOS</a>
        <a href="/sobre">SOBRE</a>
        <a href="#resultados" (click)="resultado()">PORTAL DE RESULTADOS</a>
      </nav>

     <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir Menu">
      <span class="line"></span>
      <span class="line"></span>
      <span class="line"></span>
    </button>

  </div>

  <!-- Lista de Rotas Mobile (Exibida apenas quando clicado) -->
  <nav class="mobile-dropdown" *ngIf="menuAberto">
    <a routerLink="/" (click)="toggleMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">HOME</a>
    <a routerLink="/guia-exames" (click)="toggleMenu()" routerLinkActive="active">EXAMES</a>
    <a href="#convenios" (click)="toggleMenu()" routerLinkActive="active">CONVÊNIOS</a>
    <a routerLink="/sobre" (click)="toggleMenu()" routerLinkActive="active">SOBRE</a>
    <a href="#resultados" (click)="resultado()" (click)="toggleMenu()">PORTAL DE RESULTADOS</a>
  </nav>


  </header>
