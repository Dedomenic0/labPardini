<div class="exames-convenios-wrapper">
  
  <!-- SEÇÃO DE CONVÊNIOS -->
  <section id="convenios" class="convenios-section">
    <div class="section-container">
     
      <span class="convenios-title">CONVÊNIOS</span>
      <div class="convenios-grid">
        <div *ngFor="let conv of conveniosList" class="convenio-card">
          <span class="convenio-name"><img src="{{ conv.logo }}" alt="{{ conv.name }}"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- SEÇÃO DE EXAMES -->
  <section id="exames" class="exames-section">
    <div class="exames-overlay"></div>
    <div class="section-container relative-z">
      
      <div class="section-header light">
        
        <h2>NOSSOS EXAMES</h2>
        <p>Veja alguns de nossos exames disponíveis no catálogo, além de muitos outros</p>

        <button class="catalogo-btn" routerLink="/guia-exames">Ver Catálogo Completo</button>
      </div>

      <div class="exames-grid">
        <!-- Coluna 1 -->
        <div class="exames-box">
          <h3>Hematologia</h3>
          <ul>
            <li *ngFor="let exame of examesColuna1">
              <span class="bullet">✓</span> {{ exame }}
            </li>
          </ul>
        </div>

        <!-- Coluna 2 -->
        <div class="exames-box">
          <h3>Bioquímica</h3>
          <ul>
            <li *ngFor="let exame of examesColuna2">
              <span class="bullet">✓</span> {{ exame }}
            </li>
          </ul>
        </div>

        <div class="exames-box">
          <h3>Hormonais</h3>
          <ul>
            <li *ngFor="let exame of examesColuna3">
              <span class="bullet">✓</span> {{ exame }}
            </li>
          </ul>
        </div>

        <div class="exames-box">
          <h3>Imunologicos</h3>
          <ul>
            <li *ngFor="let exame of examesColuna4">
              <span class="bullet">✓</span> {{ exame }}
            </li>
          </ul>
        </div>

        <div class="exames-box">
          <h3>Outros</h3>
          <ul>
            <li *ngFor="let exame of examesColuna5">
              <span class="bullet">✓</span> {{ exame }}
            </li>
          </ul>
        </div>

      </div>

    </div>
  </section>

</div>
